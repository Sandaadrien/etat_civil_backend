# Quality gate configuration, one entry per target (the two code bases of the repository).
# Keep these values aligned with the sub-module settings of the dashboard.

# When the job must fail:
#   critical : at least one critical finding (recommended)
#   warning  : at least one warning or critical finding
#   never    : never fail, only report
fail_on: critical

# GitHub issues, created with:  python quality/run.py --target <name> --sync-issues
issues:
  on_critical: true       # create one detailed issue per critical function / rule
  on_warning: false       # also create issues for warnings (QUALITY_ISSUE_ON_WARNING overrides it)
  on_info: false          # also create issues for information findings (Semgrep only)
  warning_mode: digest    # digest = one issue per target | individual = one issue per warning
  on_change: comment      # comment | update | ignore, when an existing issue changes
  branch: main            # in GitHub Actions, issues are only synchronised from this branch
  max_per_run: 20         # safety limit for the number of issues created in one run
  close_resolved: true    # close an issue when its finding disappears
  reopen_resolved: true   # reopen an issue closed by the gate when its finding comes back

targets:
  #------ NestJS ----------
  backend:
    label: Backend (NestJS)
    paths:
      - src
    lizard:
      languages: [javascript, typescript]
      exclude: ["*/node_modules/*"]
      thresholds:
        cyclomatic_complexity: 10
        nloc: 50
        parameter_count: 5
        token_count: 500
      # A violation is critical from threshold x this factor, otherwise it is a warning.
      critical_multiplier: 1.5
      # Do not count ?? and ?. as conditions.
      ignore_nullish_and_optional_chaining: true
    semgrep:
      # Local rule packs of quality/rules (name without extension), or registry ids such as p/typescript.
      configs: [style-typescript, best-practices-nestjs]
      exclude: [node_modules, dist, build, coverage]
      exclude_rules: []
      # INFO, WARNING or ERROR: findings below this level are ignored.
      min_severity: INFO