
name: Deploy Etat Civil

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etat-civil-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Construire le backend NestJS
      - name: Build Backend Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t etat-civil-backend:${GITHUB_SHA} .

      # 2. Construire le service Python OCR
      - name: Build OCR Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t etat-civil-ocr:${GITHUB_SHA} \
            ./actes-naissance

      - name: Configure SSH
        env:
          HOST: ${{ secrets.HOST }}
          USER1: ${{ secrets.USER1 }}
          HOST2: ${{ secrets.HOST2 }}
          USER2: ${{ secrets.USER2 }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${HOST}
            User ${USER1}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new

          Host school
            HostName ${HOST2}
            User ${USER2}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ProxyJump vps
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes school "whoami"

      - name: Prepare deployment directory
        run: |
          ssh school \
            "mkdir -p /home/cloud/apps/etat-civil"

      - name: Transfer deployment files
        run: |
          scp compose.prod.yml \
            school:/home/cloud/apps/etat-civil/

          scp scripts/deploy-prod.sh \
            school:/home/cloud/apps/etat-civil/

      # 3. Envoyer l'image backend
      - name: Transfer Backend Docker image
        run: |
          docker save etat-civil-backend:${GITHUB_SHA} \
            | ssh school "docker load"

      # 4. Envoyer l'image OCR
      - name: Transfer OCR Docker image
        run: |
          docker save etat-civil-ocr:${GITHUB_SHA} \
            | ssh school "docker load"

      # 5. Déployer les services
      - name: Run deployment
        run: |
          ssh school \
            "bash /home/cloud/apps/etat-civil/deploy-prod.sh ${GITHUB_SHA}"

      - name: Deployment completed
        run: |
          echo "Etat Civil Backend + OCR deployed successfully"
          echo "Commit: ${GITHUB_SHA}"
