
name: etat-civil

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  ocr:
    image: etat-civil-ocr:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: http://ollama:11434
      OCR_MODEL: qwen2.5:7b
      OCR_MOCK_MODE: "false"
    expose:
      - "8000"
    networks:
      - internal
      - ollama_network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    image: etat-civil-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      OCR_API_URL: http://ocr:8000
    ports:
      - "100.101.128.43:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - ollama_network

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge

  ollama_network:
    external: true
    name: ollama_shared
